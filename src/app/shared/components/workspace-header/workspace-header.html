<header class="workspace-header">
  <img class="workspace-header__logo" src="/assets/img/icons/logo_header.svg" alt="app logo" />

  <div class="workspace-header__search">
    <div class="workspace-header__input-container">
      <app-input-icon type="search"></app-input-icon>

      <input
        type="text"
        class="workspace-header__search-input"
        placeholder="Devspace durchsuchen"
      />
    </div>
  </div>

  <button class="workspace-header__user">
    <span class="workspace-header__user-name">{{ currentUser?.name }}</span>

    <div class="workspace-header__avatar-status">
      <img
        class="workspace-header__avatar"
        src="/assets/img/avatars/default_user.png"
        alt="the avatar image"
      />
      <div
        class="workspace-header__status-bullet"
        [ngClass]="{
          'workspace-header__status-bullet--online': currentUser?.status === 'online',
          'workspace-header__status-bullet--offline': currentUser?.status === 'offline',
          'workspace-header__status-bullet--away': currentUser?.status === 'away',
        }"
      ></div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" fill="none">
      <mask
        id="mask0_235_460"
        style="mask-type: alpha"
        maskUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="30"
        height="30"
      >
        <rect width="30" height="30" fill="#D9D9D9" />
      </mask>
      <g mask="url(#mask0_235_460)">

          d="M15 19.1875C14.8333 19.1875 14.6721 19.1562 14.5162 19.0937C14.3596 19.0312 14.2292 18.9479 14.125 18.8437L8.375 13.0938C8.14583 12.8646 8.03125 12.5729 8.03125 12.2187C8.03125 11.8646 8.14583 11.5729 8.375 11.3437C8.60417 11.1146 8.89583 11 9.25 11C9.60417 11 9.89583 11.1146 10.125 11.3437L15 16.2188L19.875 11.3437C20.1042 11.1146 20.3958 11 20.75 11C21.1042 11 21.3958 11.1146 21.625 11.3437C21.8542 11.5729 21.9688 11.8646 21.9688 12.2187C21.9688 12.5729 21.8542 12.8646 21.625 13.0938L15.875 18.8437C15.75 18.9687 15.6146 19.0571 15.4688 19.1087C15.3229 19.1612 15.1667 19.1875 15 19.1875Z"

  </button>
</header>
