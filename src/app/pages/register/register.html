<section class="register-page">
  <main class="content-wrapper">
    <app-header [showRegister]="false"></app-header>
    <!-- REGISTRATION-Section -->
    <section class="register-page__main-section">
      <form class="card card-basestyle">
        <div class="title-container">
          <button class="go-back-btn abs-pos" (click)="returnToSignin()">
            <img src="/assets/img/icons/arrow_left.svg" alt="arrow poinint to the left" />
          </button>
          <h1>Konto erstellen</h1>
        </div>
        <span>Mit deinem Namen und deiner E-Mail-Adresse hast du dein neues DABubble-Konto.</span>
        <!-- INPUT section -->
        <app-input
          type="name"
          placeholder="Name und Nachname"
          (valueChange)="form.controls.name.setValue($event)"
          [controls]="form.controls.name"
        ></app-input>
        <app-input
          type="email"
          placeholder="beispielname@email.com"
          (valueChange)="form.controls.email.setValue($event)"
          [controls]="form.controls.email"
        ></app-input>
        <app-input
          type="password"
          placeholder="Passwort"
          (valueChange)="form.controls.password.setValue($event)"
          [controls]="form.controls.password"
        ></app-input>

        <div class="privacy-policy">
          <div class="checkbox btn-pw" [class.checked]="isChecked" (click)="toggleCheckbox()"></div>
          <p>
            Ich stimme der
            <a class="link-priv-pol btn-pw" (click)="redirectToPrivPol()">Datenschutzerklärung</a>
            zu.
          </p>
        </div>
        <footer class="card-footer">
          <button
            type="button"
            class="btn-primary-blue"
            (click)="redirectToAvatar()"
            [disabled]="!form.valid || !isChecked"
          >
            Weiter
          </button>
        </footer>
      </form>
      <app-footer class="footer"></app-footer>
    </section>
  </main>
</section>
