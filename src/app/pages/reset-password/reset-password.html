<section class="pw-page">
  <main class="content-wrapper">
    <app-header [showRegister]="false"></app-header>
    <section class="pw-page__main-section">
      <form class="card card-basestyle">
        <div class="title-container">
          <button class="go-back-btn abs-pos" (click)="returnToResPwReq()">
            <img src="/assets/img/icons/arrow_left.svg" alt="arrow poinint to the left" />
          </button>
          <h1>Passwort zurücksetzen</h1>
        </div>
        <!-- INPUT section -->
        <app-input
          type="password"
          placeholder="Neues Passwort"
          [controls]="form.controls.password"
        ></app-input>
        <app-input
          type="password"
          placeholder="Neues Passwort bestätigen"
          [controls]="form.controls.confirmPassword"
        ></app-input>
        <footer class="card-footer">
          <button
            type="button"
            class="btn-primary-blue pw-change"
            (click)="showTooltip()"
            [disabled]="!form.valid"
          >
            Passwort ändern
          </button>
        </footer>
      </form>
      <app-footer class="footer"></app-footer>
    </section>

    <div class="overlay" [class.overlay--visible]="!hideTooltip">
      <span class="tooltip color">Anmelden</span>
    </div>
  </main>
</section>
