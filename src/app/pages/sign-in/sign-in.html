<section class="sign-in-page">
  <main class="content-wrapper">
    <app-header [showRegister]="true"></app-header>
    <section class="sign-in-page__main-section">
      <form class="card card-basestyle">
        <h1>Anmeldung</h1>
        <span
          >Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</span
        >
        <!-- INPUT section -->
        <app-input
          type="email"
          placeholder="beispielname@email.com"
          [controls]="form.controls.email"
        ></app-input>
        <app-input
          type="password"
          placeholder="Passwort"
          [controls]="form.controls.password"
        ></app-input>
        <button class="btn-pw" (click)="redirectToPwChange()">Passwort vergessen?</button>
        <div class="separator">
          <div class="separator__line"></div>
          <p>oder</p>
          <div class="separator__line"></div>
        </div>
        <button class="btn-google">
          <img src="/assets/img/icons/google_icon.svg" alt="the logo of Google" />
          Anmelden mit Google
        </button>
        <footer class="card-footer">
          <button class="btn-primary-blue" [disabled]="!form.valid">Anmelden</button>
          <button class="btn-secondary-blue" (click)="redirectToApp()">Gäste-Login</button>
        </footer>
      </form>
      <app-footer class="footer"></app-footer>
    </section>
  </main>
</section>
