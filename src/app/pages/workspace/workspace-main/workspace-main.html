<section class="workspace-main">
  <main class="content-wrapper">
    <app-workspace-header
      [user]="currentUser"
      (openOverlay)="openOverlay($event)"
    ></app-workspace-header>
    <section class="workspace-chat-area">
      <app-workspace-sidebar></app-workspace-sidebar>
      <app-workspace-chat></app-workspace-chat>
      <app-workspace-thread></app-workspace-thread>
    </section>
  </main>
  @if (isOverlayOpen) {
    <app-overlay
      class="workspace-overlay"
      [visible]="isOverlayOpen"
      [view]="overlayView"
      [user]="currentUser"
      (logout)="handleLogout()"
      (close)="closeOverlay()"
      (switchView)="onSwitchView($event)"
    ></app-overlay>
  }
</section>
